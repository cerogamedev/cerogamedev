<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="CEREN GOR — GAME DESIGNER — SYSTEMS AND ECONOMY">

  <defs>
    <!-- ── TV STATIC / FILM GRAIN ─────────────────────────────── -->
    <filter id="ow-static" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="2" result="n">
        <animate attributeName="seed" values="1;5;2;9;3;12;6;15;4;11"
                 dur="0.5s" repeatCount="indefinite" calcMode="discrete"/>
      </feTurbulence>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.86
                0 0 0 0 0.84
                0 0 0 0 0.78
                1.1 0 0 0 -0.35"/>
    </filter>

    <!-- ── DENSE STATIC (for the portal window) ────────────────── -->
    <filter id="ow-portal" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.62 0.95" numOctaves="2" seed="7" result="n">
        <animate attributeName="seed" values="3;8;1;14;6;19;2;10"
                 dur="0.28s" repeatCount="indefinite" calcMode="discrete"/>
      </feTurbulence>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.72
                0 0 0 0 0.69
                0 0 0 0 0.63
                1.6 0 0 0 -0.55"/>
    </filter>

    <!-- ── ROLLING FOG ────────────────────────────────────────── -->
    <filter id="ow-fog" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0055 0.013" numOctaves="4" seed="11" result="f">
        <animate attributeName="baseFrequency"
                 values="0.0055 0.013; 0.0090 0.0095; 0.0040 0.016; 0.0055 0.013"
                 dur="34s" repeatCount="indefinite"/>
      </feTurbulence>
      <feColorMatrix in="f" type="matrix"
        values="0 0 0 0 0.42
                0 0 0 0 0.44
                0 0 0 0 0.41
                0.85 0.35 0 0 -0.32"/>
    </filter>

    <!-- ── CRT SCANLINES ──────────────────────────────────────── -->
    <pattern id="ow-scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.60"/>
    </pattern>

    <!-- ── VIGNETTE ───────────────────────────────────────────── -->
    <radialGradient id="ow-vig" cx="34%" cy="50%" r="78%">
      <stop offset="35%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.92"/>
    </radialGradient>

    <!-- ── SWEEPING TRACKING BAR ──────────────────────────────── -->
    <linearGradient id="ow-sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#E8E2D4" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#E8E2D4" stop-opacity="0.5"/>
      <stop offset="55%"  stop-color="#E8E2D4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E8E2D4" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="ow-clip"><rect x="0" y="0" width="1000" height="280"/></clipPath>
  </defs>

  <g clip-path="url(#ow-clip)">

    <!-- BASE -->
    <rect width="1000" height="280" fill="#08080A"/>
    <rect width="1000" height="280" filter="url(#ow-fog)" opacity="0.55"/>
    <rect width="1000" height="280" fill="url(#ow-vig)"/>

    <!-- ── PORTAL: a hole in the wall full of static ──────────── -->
    <g>
      <rect x="742" y="26" width="230" height="228" fill="#000000"/>
      <rect x="742" y="26" width="230" height="228" filter="url(#ow-portal)" opacity="0.55"/>
      <rect x="742" y="26" width="230" height="228" fill="none" stroke="#B4231A" stroke-width="2">
        <animate attributeName="stroke-opacity"
                 values="1;0.35;1;1;0.6;1" dur="4.3s" repeatCount="indefinite" calcMode="discrete"/>
      </rect>
      <!-- corner brackets -->
      <path d="M742 44 L742 26 L760 26 M954 26 L972 26 L972 44 M972 236 L972 254 L954 254 M760 254 L742 254 L742 236"
            fill="none" stroke="#E8E2D4" stroke-width="3" opacity="0.85"/>
      <text x="754" y="246" font-family="'Courier New',Courier,monospace" font-size="11"
            letter-spacing="2.5" fill="#B4231A" opacity="0.9">REC</text>
      <circle cx="960" cy="42" r="4" fill="#B4231A">
        <animate attributeName="opacity" values="1;1;0.1;0.1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- ── TITLE ─────────────────────────────────────────────── -->
    <g>
      <!-- flicker on the whole block -->
      <animate attributeName="opacity"
               values="1;1;1;1;1;0.28;1;1;0.72;1;1;1;0.15;1;1;1;1;1"
               dur="7.5s" repeatCount="indefinite" calcMode="discrete"/>

      <!-- chromatic aberration ghosts -->
      <g opacity="0.85">
        <text font-family="Impact,'Arial Black','Haettenschweiler',sans-serif" font-size="86"
              letter-spacing="4" fill="#C41A10" x="56" y="132">
          CEREN GÖR
          <animate attributeName="x" values="56;51;58;56;56;62;54;56"
                   dur="3.1s" repeatCount="indefinite" calcMode="discrete"/>
        </text>
        <text font-family="Impact,'Arial Black','Haettenschweiler',sans-serif" font-size="86"
              letter-spacing="4" fill="#1E6B72" x="56" y="132">
          CEREN GÖR
          <animate attributeName="x" values="56;61;53;56;56;50;59;56"
                   dur="3.1s" repeatCount="indefinite" calcMode="discrete"/>
        </text>
      </g>

      <text font-family="Impact,'Arial Black','Haettenschweiler',sans-serif" font-size="86"
            letter-spacing="4" fill="#E8E2D4" x="56" y="132">CEREN GÖR</text>

      <!-- red rule -->
      <rect x="58" y="152" width="0" height="3" fill="#C41A10">
        <animate attributeName="width" values="0;560" dur="1.4s" fill="freeze"/>
      </rect>

      <text font-family="'Courier New',Courier,monospace" font-size="17" font-weight="bold"
            letter-spacing="5" fill="#9C958A" x="60" y="186">GAME DESIGNER</text>
      <text font-family="'Courier New',Courier,monospace" font-size="13"
            letter-spacing="3.4" fill="#6E675C" x="60" y="212">SYSTEM &amp; ECONOMY DESIGN // UNITY // C#</text>
      <text font-family="'Courier New',Courier,monospace" font-size="13"
            letter-spacing="3.4" fill="#6E675C" x="60" y="234">OXON GAMES &#183; MONOLITHPULSE</text>
    </g>

    <!-- ── SWEEP + SCANLINES + GRAIN ─────────────────────────── -->
    <rect x="0" y="0" width="1000" height="46" fill="url(#ow-sweep)" opacity="0.10">
      <animate attributeName="y" values="-60;300" dur="7s" repeatCount="indefinite"/>
    </rect>

    <rect width="1000" height="280" fill="url(#ow-scan)" opacity="0.42"/>
    <rect width="1000" height="280" filter="url(#ow-static)" opacity="0.13"/>

    <rect x="0.5" y="0.5" width="999" height="279" fill="none" stroke="#2A2724" stroke-width="1"/>
  </g>
</svg>
