<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="Style meter climbing from D to ULTRAKILL">

  <defs>
    <filter id="sm-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="4" result="n">
        <animate attributeName="seed" values="2;9;4;13;7;16;3;11"
                 dur="0.5s" repeatCount="indefinite" calcMode="discrete"/>
      </feTurbulence>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.9  0 0 0 0 0.88  0 0 0 0 0.84  1.1 0 0 0 -0.38"/>
    </filter>
    <pattern id="sm-scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.55"/>
    </pattern>
    <clipPath id="sm-clip"><rect width="1000" height="250"/></clipPath>
  </defs>

  <g clip-path="url(#sm-clip)">
    <rect width="1000" height="250" fill="#050506"/>

    <!-- red flash when the meter maxes out -->
    <rect width="1000" height="250" fill="#C41A10" opacity="0">
      <animate attributeName="opacity" values="0;0;0.30;0.06;0.22;0.03;0"
               keyTimes="0;0.70;0.71;0.735;0.75;0.78;0.82"
               dur="10s" repeatCount="indefinite" calcMode="discrete"/>
    </rect>

    <text x="40" y="42" font-family="'Courier New',Courier,monospace" font-size="12"
          letter-spacing="5" fill="#6E675C">STYLE METER</text>
    <rect x="40" y="54" width="920" height="1" fill="#2A2724"/>

    <!-- ── RANK LETTERS ────────────────────────────────────────── -->
    <g font-family="Impact,'Arial Black','Haettenschweiler',sans-serif" text-anchor="start">

      <text x="40" y="168" font-size="118" letter-spacing="2" fill="#7E7A70">D
        <animate attributeName="opacity" values="1;0;0" keyTimes="0;0.09;1" dur="10s" repeatCount="indefinite" calcMode="discrete"/>
      </text>
      <text x="40" y="168" font-size="118" letter-spacing="2" fill="#8E8A7E">C
        <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.09;0.18;1" dur="10s" repeatCount="indefinite" calcMode="discrete"/>
      </text>
      <text x="40" y="168" font-size="118" letter-spacing="2" fill="#A39C8D">B
        <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.18;0.27;1" dur="10s" repeatCount="indefinite" calcMode="discrete"/>
      </text>
      <text x="40" y="168" font-size="118" letter-spacing="2" fill="#C8C0B0">A
        <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.27;0.36;1" dur="10s" repeatCount="indefinite" calcMode="discrete"/>
      </text>
      <text x="40" y="168" font-size="118" letter-spacing="2" fill="#E0A32A">S
        <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.36;0.47;1" dur="10s" repeatCount="indefinite" calcMode="discrete"/>
      </text>
      <text x="40" y="168" font-size="118" letter-spacing="2" fill="#E07A18">SS
        <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.47;0.58;1" dur="10s" repeatCount="indefinite" calcMode="discrete"/>
      </text>
      <text x="40" y="168" font-size="118" letter-spacing="2" fill="#D8341F">SSS
        <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.58;0.70;1" dur="10s" repeatCount="indefinite" calcMode="discrete"/>
      </text>

      <g>
        <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.70;1" dur="10s" repeatCount="indefinite" calcMode="discrete"/>
        <text x="40" y="160" font-size="72" letter-spacing="1" fill="#C41A10">ULTRAKILL
          <animate attributeName="x" values="40;36;44;40;40;46;40" dur="0.35s" repeatCount="indefinite" calcMode="discrete"/>
        </text>
        <text x="40" y="160" font-size="72" letter-spacing="1" fill="#E8E2D4" opacity="0.55">ULTRAKILL
          <animate attributeName="x" values="40;44;36;40;40;34;40" dur="0.35s" repeatCount="indefinite" calcMode="discrete"/>
        </text>
      </g>
    </g>

    <!-- ── STYLE BONUS FEED ───────────────────────────────────── -->
    <g font-family="'Courier New',Courier,monospace" font-size="15" font-weight="bold"
       letter-spacing="2.2" text-anchor="end">
      <text x="960" y="90"  fill="#E8E2D4">CORE LOOP<tspan fill="#C41A10">  +120</tspan>
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.10;0.60;0.70;1" dur="10s" repeatCount="indefinite"/>
      </text>
      <text x="960" y="114" fill="#E8E2D4">ECONOMY BALANCE<tspan fill="#C41A10">  +240</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.18;0.24;0.62;0.70;1" dur="10s" repeatCount="indefinite"/>
      </text>
      <text x="960" y="138" fill="#E8E2D4">SCRIPTABLEOBJECT PIPELINE<tspan fill="#C41A10">  +310</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32;0.38;0.64;0.70;1" dur="10s" repeatCount="indefinite"/>
      </text>
      <text x="960" y="162" fill="#E8E2D4">SHADERLAB PASS<tspan fill="#C41A10">  +450</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.46;0.52;0.66;0.70;1" dur="10s" repeatCount="indefinite"/>
      </text>
      <text x="960" y="186" fill="#E8E2D4">NAVMESH FSM<tspan fill="#C41A10">  +600</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.58;0.63;0.67;0.70;1" dur="10s" repeatCount="indefinite"/>
      </text>
      <text x="960" y="150" font-size="26" fill="#C41A10" letter-spacing="4">SHIPPED IT
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.73;0.76;1" dur="10s" repeatCount="indefinite" calcMode="discrete"/>
      </text>
    </g>

    <!-- ── METER BAR ──────────────────────────────────────────── -->
    <rect x="40" y="206" width="920" height="10" fill="#161513"/>
    <rect x="40" y="206" width="0" height="10" fill="#C41A10">
      <animate attributeName="width"
               values="0;90;210;330;450;570;700;830;920;920"
               keyTimes="0;0.09;0.18;0.27;0.36;0.47;0.58;0.70;0.72;1"
               dur="10s" repeatCount="indefinite" calcMode="discrete"/>
    </rect>
    <rect x="40" y="206" width="920" height="10" fill="none" stroke="#2A2724" stroke-width="1"/>

    <text x="40" y="236" font-family="'Courier New',Courier,monospace" font-size="11"
          letter-spacing="3" fill="#4A453D">RANK RISES WHILE YOU KEEP MOVING</text>

    <rect width="1000" height="250" fill="url(#sm-scan)" opacity="0.38"/>
    <rect width="1000" height="250" filter="url(#sm-grain)" opacity="0.11"/>
    <rect x="0.5" y="0.5" width="999" height="249" fill="none" stroke="#2A2724"/>
  </g>
</svg>
