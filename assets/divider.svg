<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 16" width="1000" height="16" role="img" aria-label="divider">
  <defs>
    <filter id="dv-n" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.75 0.9" numOctaves="1" seed="5" result="n">
        <animate attributeName="seed" values="1;6;3;10;5;14;2;8"
                 dur="0.22s" repeatCount="indefinite" calcMode="discrete"/>
      </feTurbulence>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.76  0 0 0 0 0.74  0 0 0 0 0.68  1.5 0 0 0 -0.62"/>
    </filter>
    <linearGradient id="dv-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#000" stop-opacity="1"/>
      <stop offset="12%"  stop-color="#000" stop-opacity="0"/>
      <stop offset="88%"  stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="16" filter="url(#dv-n)" opacity="0.5"/>
  <rect x="0" y="7" width="1000" height="1" fill="#C41A10" opacity="0.75"/>
  <rect x="0" y="0" width="120" height="16" fill="#C41A10" opacity="0.9">
    <animate attributeName="x" values="-120;1000" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.15;0.9" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
